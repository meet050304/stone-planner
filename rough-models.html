<script>
var MEASURED_DENSITY=3.50874;
// Picks the file's current plan by weight, the same as the main viewer.
function stoneWeight(r){
  const m=brilliant(r,r.prop),p=m.pos,t=m.tris,n=p.length/3;let cx=0,cy=0,cz=0;
  for(let i=0;i<p.length;i+=3){cx+=p[i]/n;cy+=p[i+1]/n;cz+=p[i+2]/n}
  let v=0;
  for(let i=0;i<t.length;i+=3){
    const a=t[i]*3,b=t[i+1]*3,c=t[i+2]*3,ax=p[a]-cx,ay=p[a+1]-cy,az=p[a+2]-cz,bx=p[b]-cx,by=p[b+1]-cy,bz=p[b+2]-cz,dx=p[c]-cx,dy=p[c+1]-cy,dz=p[c+2]-cz;
    v+=Math.abs(ax*(by*dz-bz*dy)+ay*(bz*dx-bx*dz)+az*(bx*dy-by*dx));
  }
  return v/6/1e9*MEASURED_DENSITY/200;
}

      for(let i=p+4;i<p+4+L;i++)if(u8[i]<32||u8[i]>126){ok=false;break}

}

  if(at===undefined)return{};
  const toks=readTokens(u8,dv,Math.max(0,u8.length-3e6)+at-4,60000);
  const keys=[];toks.forEach((t,i)=>{if(FIELD_KEY.test(t))keys.push(i)});

    const stop=n+1<keys.length?keys[n+1]-1:k+1;
    let v='';

}

    if(!okVertex(o)){damaged.add(i);continue}

  }

      for(let i=0;i<n;i++){const v=dv.getUint32(q+4+4*i,true);if(v>=nv){ok=false;break}idx.push(v)}

// Gives damaged points the middle of their neighbours and puts their faces back, closing the holes.

  }
  const left=new Set(m.damaged);
  for(let pass=0;pass<20&&left.size;pass++)for(const v of [...left]){
    const good=[...(near.get(v)||[])].filter(n=>!left.has(n));
    if(!good.length)continue;
    for(let k=0;k<3;k++)m.pos[v*3+k]=good.reduce((t,n)=>t+m.pos[n*3+k],0)/good.length;

    const a=t[i]*3,b=t[i+1]*3,c=t[i+2]*3;

  const step=2*Math.PI/300,bytes=new Uint8Array(new Float64Array([1.5*Math.PI]).buffer);
  for(const h of findAll(u8,bytes)){
    if(h<460||Math.abs(dv.getFloat64(h+8,true)-1.5*Math.PI-step)>1e-6)continue;
    const R=[0,1,2].map(r=>[0,1,2].map(c=>dv.getFloat64(h-84+8*(3*r+c),true)));
    const T=[0,1,2].map(i=>dv.getFloat64(h-108+8*i,true));

  const out=[],P=stone.pos,T=stone.tris;
  for(let i=0;i<T.length;i+=3){

}
function jpegWidth(u8,s,e){
  for(let i=s+2;i<e-9;){
    if(u8[i]!==0xff){i++;continue}
    const m=u8[i+1];
    if(m>=0xc0&&m<=0xc3)return u8[i+7]*256+u8[i+8];
    i+=2+u8[i+2]*256+u8[i+3];
  }

}
function findImages(u8,file){
  const soi=[];let i=0;
  while((i=u8.indexOf(0xff,i))!==-1&&i<u8.length-3){
    if(u8[i+1]===0xd8&&u8[i+2]===0xff&&(u8[i+3]===0xe0||u8[i+3]===0xdb||u8[i+3]===0xe1))soi.push(i);
    i++;
  }
  const out=[];
  soi.forEach((s,k)=>{
    const lim=k+1<soi.length?soi[k+1]:u8.length;
    for(let e=lim-2;e>s;e--)if(u8[e]===0xff&&u8[e+1]===0xd9){if(e+2-s>5000)out.push({s,e:e+2,w:jpegWidth(u8,s,e)});break}
  });

}
function namedOptions(u8,dv){
  const names=new Set,shapes=new Set;
  for(const pre of['Saw','Pie']){
    for(const p of findAll(u8,ascii(pre))){
      if(p<4)continue;
      const L=dv.getUint32(p-4,true);
      if(L>=5&&L<12&&/^(Saw|Pie)\d+-\d+$/.test(text(u8,p,p+L)))names.add(text(u8,p,p+L));
    }

// Plan records end with a pair of -12345 markers; the first ones in a file are the current plan.
function readPlacements(u8,dv,count){
  const out=[];
  for(const h of findAll(u8,new Uint8Array(new Float64Array([-12345]).buffer))){
    const q=h-92;
    if(q<56||out.length>=count)continue;
    const D=dv.getFloat64(q,true);
    if(!(D>100&&D<6000))continue;
    const n=[0,1,2].map(i=>dv.getFloat64(q+32+8*i,true));
    if(Math.abs(n[0]**2+n[1]**2+n[2]**2-1)>1e-3)continue;
    out.push({q,D,angles:[0,1,2].map(i=>dv.getFloat64(q-56+8*i,true)),center:[0,1,2].map(i=>dv.getFloat64(q-24+8*i,true))});

// A file can keep earlier plans and Advisor's list of other results beside the current plan. Stone records a few

// plan, or without those fields, read as before: the first records.
